[tools]
python = "3.12.3"
uv = "0.9.4"

[env]
_.python.venv = { path = ".venv", create = true } 
PYTHONPATH="{{config_root}}/src"


[tasks."install"]
description = "Install dependencies"
run = "uv pip install -r requirements.txt"

[tasks."format:python"]
description = "Format Python code"
depends = ["install"]
run = "uv run python -m autopep8 --in-place --aggressive --recursive ."

[tasks."run:dev"]
description = "Run the application in development mode"
depends = ["install"]
env.MLFLOW_TRACKING_URI = "http://localhost:8090"
env.OBJC_DISABLE_INITIALIZE_FORK_SAFETY = "YES"
run = "uv run gunicorn -w 1 --threads 1 -b '0.0.0.0:8000' app:app --log-level debug --reload"

[tasks."run:airflow"]
description = "Run airflow on localhost:8080 with credentials `admin:admin`"
depends = ["install"]
env.AIRFLOW_HOME = "{{config_root}}/airflow"
env.OBJC_DISABLE_INITIALIZE_FORK_SAFETY = "YES"
env.AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_PASSWORDS_FILE = "{{config_root}}/airflow/simple_auth_manager_passwords.json"
env.AIRFLOW__CORE__LOAD_EXAMPLES = "False"
run = "uv run airflow standalone"

[tasks."run:mlflow"]
description = "Run mlflow tracking server on localhost:8090"
env.MLFLOW_SERVER_ALLOWED_HOSTS = "host.docker.internal,localhost,127.0.0.1,host.docker.internal:8090,localhost:8090,127.0.0.1:8090"
depends = ["install"]
run = "mlflow server --host 0.0.0.0 --port 8090"

[tasks."test"]
description = "Run all available test"
depends = ["install"]
run = "uv run pytest"

[tasks."docker:build"]
description = "Builds dockerfile with the name wine-prediction-app."
run = "docker build -t wine-prediction-app ."

[tasks."docker:run"]
description = "Runs a docker container of the app with name wine-prediction-app in detach mode on bridge port 8000."
depends = ["docker:build"]
env.MLFLOW_TRACKING_URI = "http://host.docker.internal:8090"
run = """
    docker run \
    --rm \
    --env MLFLOW_TRACKING_URI=$MLFLOW_TRACKING_URI \
    --add-host=host.docker.internal:host-gateway \
    --name wine-prediction-app \
    -p 8000:8000 \
    wine-prediction-app
"""

[tasks."docker:kill"]
description = "Kills the docker container of the app"
run = "docker kill wine-prediction-app"
